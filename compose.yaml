name: foxprofile

services:
  foxprofile:
    build: .
    image: foxprofile:local
    platform: linux/amd64
    init: true
    restart: unless-stopped
    shm_size: 2gb
    stop_grace_period: 45s
    # Chromium uses unprivileged user namespaces for its own sandbox.
    security_opt:
      - seccomp=unconfined
    env_file:
      - .env
    environment:
      FOXPROFILE_API_HOST: 0.0.0.0
      FOXPROFILE_API_PORT: "8000"
      FOXPROFILE_PROFILES_FILE: /data/profiles.json
      FOXPROFILE_DATA_DIR: /data/profiles
      FOXPROFILE_LOG_DIR: /data/logs
      DISPLAY: ":99"
    ports:
      - "${FOXPROFILE_BIND_IP:-127.0.0.1}:${FOXPROFILE_HTTP_PORT:-8000}:8000"
      - "${FOXPROFILE_BIND_IP:-127.0.0.1}:${FOXPROFILE_NOVNC_PORT:-6080}:6080"
    volumes:
      - foxprofile_data:/data
      - ./docker-data/exchange:/data/exchange
    healthcheck:
      test: ["CMD", "python", "deploy/docker-healthcheck.py"]
      interval: 30s
      timeout: 15s
      start_period: 45s
      retries: 3

volumes:
  foxprofile_data:
